<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Lyfe Altering Career Academy — under construction. Coming soon.">
  <title>Under Construction | Lyfe Altering Career Academy</title>
  <style>
    :root {
      --cream: #f5efe5;
      --copper: #c47245;
      --gold: #c8a27a;
      --ink: #111111;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--cream);
      background:
        radial-gradient(circle at 50% 35%, rgba(196, 114, 69, 0.18), transparent 28rem),
        linear-gradient(135deg, #0b0b0b 0%, #171311 55%, #0b0b0b 100%);
      font-family: Georgia, "Times New Roman", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle, black 15%, transparent 75%);
    }

    main {
      position: relative;
      width: min(90%, 760px);
      text-align: center;
      padding: 3.5rem 2rem;
    }

    .logo {
      width: min(180px, 42vw);
      height: auto;
      display: block;
      margin: 0 auto 2rem;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, .35));
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: .9;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }

    .accent {
      display: block;
      margin-top: .22em;
      color: var(--copper);
      font-size: .42em;
      letter-spacing: .32em;
      line-height: 1;
    }

    .rule {
      width: 96px;
      height: 3px;
      margin: 2.25rem auto 1.25rem;
      border: 0;
      background: var(--copper);
    }

    p {
      margin: 0;
      color: rgba(245, 239, 229, .72);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(.95rem, 2.5vw, 1.12rem);
      letter-spacing: .08em;
    }

    @media (max-width: 480px) {
      main { padding-inline: 1.25rem; }
      .logo { margin-bottom: 1.5rem; }
      h1 { font-size: clamp(2.7rem, 16vw, 4.25rem); }
    }

    @media (prefers-reduced-motion: no-preference) {
      main { animation: arrive .8s ease-out both; }
      @keyframes arrive {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Lyfe Altering Career Academy">
    <p class="eyebrow">Lyfe Altering Career Academy</p>
    <h1>
      Under
      <span class="accent">Construction</span>
    </h1>
    <hr class="rule">
    <p>COMING SOON</p>
  </main>
</body>
</html>
